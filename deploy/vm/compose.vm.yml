# The informal "test" environment: the whole app on one small VM (docs/operations.md section 9).
# Based on the "app" profile in the root docker-compose.yml, with these differences:
#   - only Caddy is reachable from outside (ports 80 and 443); everything else stays on the
#     private Docker network;
#   - secrets come from the untracked .env file next to this one (made by setup.sh);
#   - images are built on a Mac and copied here by deploy.sh, so nothing is built on the VM;
#   - email goes to a real SMTP provider (Brevo) instead of Mailpit.
# deploy.sh runs the one-off jobs (migrate, seed, set-role) with `docker compose run --rm`.
name: nclex

# Settings the API, worker and one-off jobs share.
x-app-settings: &app-settings
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_ENVIRONMENT: Production
  # Pools sized for one API and one worker under Postgres's 100 connections (operations.md section 2).
  ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=nclex;Username=nclex;Password=${POSTGRES_PASSWORD:?run setup.sh first};Maximum Pool Size=30
  ConnectionStrings__Redis: redis:6379
  MediaStorage__LocalRoot: /data/media

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nclex
      POSTGRES_USER: nclex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run setup.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nclex -d nclex"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 768m

  redis:
    image: redis:7
    restart: unless-stopped
    # Redis only holds data that can be rebuilt (operations.md section 6), so cap it and evict.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 192m

  # One-off: applies pending EF Core migrations, then exits.
  migrate:
    profiles: [jobs]
    image: nclex-migrations:vm
    command: ["--connection", "Host=postgres;Port=5432;Database=nclex;Username=nclex;Password=${POSTGRES_PASSWORD:?run setup.sh first}"]
    depends_on:
      postgres: { condition: service_healthy }

  # One-off jobs on the worker image: "import-questions <file>" loads content, "set-role" makes admins.
  jobs:
    profiles: [jobs]
    image: nclex-worker:vm
    environment: *app-settings
    volumes:
      - ./content:/content:ro,z
      - media-data:/data/media
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: nclex-api:vm
    restart: unless-stopped
    environment:
      <<: *app-settings
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?run setup.sh first}
      MediaStorage__SigningKey: ${MEDIA_SIGNING_KEY:?run setup.sh first}
      # Caddy and the frontend forward requests; trust their X-Forwarded-For (Docker's private ranges).
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
      ForwardedHeaders__KnownNetworks__1: 192.168.0.0/16
    volumes:
      - media-data:/data/media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # The aspnet image has no curl; bash can open a TCP socket itself.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 768m

  worker:
    image: nclex-worker:vm
    restart: unless-stopped
    environment:
      <<: *app-settings
      Email__From: ${EMAIL_FROM:?set EMAIL_FROM in .env}
      Email__FrontendBaseUrl: https://${SITE_HOST:?set SITE_HOST in .env}
      Email__Smtp__Host: ${SMTP_HOST:?set SMTP_HOST in .env}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__EnableSsl: "true"
      Email__Smtp__Username: ${SMTP_USERNAME:?set SMTP_USERNAME in .env}
      Email__Smtp__Password: ${SMTP_PASSWORD:?set SMTP_PASSWORD in .env}
    volumes:
      - media-data:/data/media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 512m

  web:
    image: nclex-web:vm
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  # The only public entry point. Gets and renews the HTTPS certificate from Let's Encrypt by itself.
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in .env}
      REDIRECT_HOSTS: ${REDIRECT_HOSTS:?set REDIRECT_HOSTS in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }
    mem_limit: 128m

volumes:
  postgres-data:
  redis-data:
  media-data:
  caddy-data:
  caddy-config:
